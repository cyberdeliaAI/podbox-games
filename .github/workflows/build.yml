# Builds every game into a .pbg on every push and attaches them all to a
# release for every tag pushed. To add a game, put its folder next to the
# others (it needs a cart.json) and add the folder's name to the cart list.
#
# Marble Chain, Pocket City 3D, Pocket Wings 3D and Powder Run 3D also get a
# web page to play them in a browser (the builder's page option), attached
# beside the carts: none of them touches the music. The exporter refuses any
# cart that reads the music (Pulse Tunnel, Bubble Beat and Sloop, even with
# their modes without it). pages.yml publishes the pages on GitHub Pages.
#
# Outpost Echo 3D and Pocket Golf Deluxe are built here as carts too, so a
# release carries them; their own workflows test them and build their pages.

name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cart: [pulsetunnel, marbles, bubblebeat, sloop, pocketwings, powderrun, pocketcity, outpostecho, pocketgolf]
        include:
          - cart: marbles
            page: true
          - cart: pocketcity
            page: true
          - cart: pocketwings
            page: true
          - cart: powderrun
            page: true
    steps:
      - uses: actions/checkout@v4

      - uses: anthonyfletcher/podbox-arcade-builder@latest
        id: cart
        with:
          cart: ${{ matrix.cart }}
          page: ${{ matrix.page || false }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cart }}
          path: |
            ${{ steps.cart.outputs.pbg }}
            ${{ steps.cart.outputs.page }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: carts
          merge-multiple: true

      - name: Attach every cart (and page) to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" carts/* --generate-notes --repo "$GITHUB_REPOSITORY"
