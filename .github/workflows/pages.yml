# Publishes the games that play in a browser on GitHub Pages, with a front
# page listing every game (docs/web/index.html), once Build has finished a
# tag like v1.0 (and its release), or by hand from main.
#
# It starts from Build's end rather than from the tag itself because the
# github-pages environment only takes deployments from main: a run started
# by Build runs on main, and checks out the tag's commit.
#
# Marble Chain, Pocket Wings 3D, Powder Run 3D and Pocket City 3D get their
# pages from the Arcade builder, as in build.yml. Outpost Echo 3D, Pocket
# Golf Deluxe and Kremlin Blocks from their own web builders on the SDK
# their workflows pin, so these are the pages their release checks test. The games that follow the
# music have no page: the exporter refuses them.

name: Pages

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  builder:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cart: [marbles, pocketwings, powderrun, pocketcity]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: anthonyfletcher/podbox-arcade-builder@latest
        id: cart
        with:
          cart: ${{ matrix.cart }}
          page: true

      # The builder writes pages with the click wheel drawn on touch screens
      # only (pbgc html's default), and has no input to change it: on a
      # computer the wheel's buttons were nowhere to be seen. Every page shows
      # it, as Outpost Echo's and Pocket Golf's own builders do
      - name: The click wheel on every page, not only on touch screens
        if: ${{ true }}
        env:
          PAGE: ${{ steps.cart.outputs.page }}
        run: |
          grep -q '"wheel":"touch"' "$PAGE"
          sed -i 's/"wheel":"touch"/"wheel":"always"/' "$PAGE"
          grep -q '"wheel":"always"' "$PAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: page-${{ matrix.cart }}
          path: ${{ steps.cart.outputs.page }}

  own:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: games
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/checkout@v4
        with:
          repository: anthonyfletcher/podbox
          ref: 126ebba20eb4f650d98ec03e6838d226af2e7013
          path: podbox

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare SDK
        working-directory: podbox/arcade/sdk
        run: npm ci

      - name: Build the pages
        working-directory: games
        run: |
          node tools/outpostecho_web.mjs
          node tools/pocketgolf_web.mjs
          node tools/kremlinblocks_web.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: page-own
          path: |
            games/dist/outpostecho.html
            games/dist/pocketgolf.html
            games/dist/kremlinblocks.html

  deploy:
    needs: [builder, own]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: page-*
          path: site
          merge-multiple: true

      - name: The front page and its pictures
        run: |
          cp docs/web/index.html site/
          mkdir -p site/screenshots
          cp docs/screenshots/*.png site/screenshots/
          cp beatdancer/previews/disco.gif site/screenshots/beatdancer.gif
          cp kremlinblocks/previews/game.gif site/screenshots/kremlinblocks.gif
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
